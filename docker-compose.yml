version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: dmpacademy-db
    environment:
      POSTGRES_DB: dmpacademy
      POSTGRES_USER: dmpacademy
      POSTGRES_PASSWORD: dmpacademy
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dmpacademy"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dmpacademy-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/dmpacademy
      SPRING_DATASOURCE_USERNAME: dmpacademy
      SPRING_DATASOURCE_PASSWORD: dmpacademy
      JWT_SECRET: dmp-academy-docker-secret-key-change-in-production-minimum-256-bits-long
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dmpacademy-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
