spring:
  application:
    name: dmp-academy

  datasource:
    url: jdbc:postgresql://localhost:5432/dmpacademy
    username: dmpacademy
    password: dmpacademy
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 20
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080

# JWT Configuration
app:
  jwt:
    secret: ${JWT_SECRET:dmp-academy-default-dev-secret-key-change-in-production-minimum-256-bits}
    access-token-expiry-ms: 900000      # 15 minutes
    refresh-token-expiry-ms: 604800000  # 7 days
  cors:
    allowed-origins: http://localhost:3000
  xp:
    lesson-completion: 10
    quiz-pass: 25
    challenge-completion: 50

# OpenAPI / Swagger
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method

---
spring:
  config:
    activate:
      on-profile: test

  datasource:
    url: jdbc:tc:postgresql:16:///dmpacademy_test
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver

  jpa:
    hibernate:
      ddl-auto: validate
